name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            cli_artifact: target/release/md2pdf-cli
            gui_bundles: deb,appimage
          - platform: macos
            os: macos-latest
            cli_artifact: target/release/md2pdf-cli
            gui_bundles: dmg
          - platform: windows
            os: windows-latest
            cli_artifact: target/release/md2pdf-cli.exe
            gui_bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev

      - name: Build CLI (release)
        run: cargo build --release -p md2pdf-cli

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: md2x-cli-${{ matrix.platform }}
          path: ${{ matrix.cli_artifact }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build GUI bundles
        working-directory: crates/md2pdf-gui
        run: cargo tauri build --bundles ${{ matrix.gui_bundles }}

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: md2x-gui-${{ matrix.platform }}
          path: target/release/bundle/**
