name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            cli_artifact: target/release/md2x-cli
            gui_bundles: deb,appimage
          - platform: macos
            os: macos-latest
            cli_artifact: target/release/md2x-cli
            gui_bundles: dmg
          - platform: windows
            os: windows-latest
            cli_artifact: target/release/md2x-cli.exe
            gui_bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev

      - name: Build CLI (release)
        run: cargo build --release -p md2x-cli

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: md2x-cli-${{ matrix.platform }}
          path: ${{ matrix.cli_artifact }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build GUI bundles
        working-directory: crates/md2x-gui
        run: cargo tauri build --bundles ${{ matrix.gui_bundles }}

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: md2x-gui-${{ matrix.platform }}
          # 只上传安装包产物，避免把 bundle 目录下的中间产物（AppDir 等）一并上传
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  release:
    name: 发布 GitHub Release
    needs: build
    # 仅 tag 推送（v*）时创建 Release，push main 只构建不发布
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # RELEASE_NOTES.md 缺失时给出占位说明，避免 body_path 指向不存在的文件
      - name: 准备发布说明
        run: |
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "本版本由 CI 自动发布。发版前可在 RELEASE_NOTES.md 中补充详细说明。" > RELEASE_NOTES.md
          fi

      - name: 下载三平台构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 展平产物目录
        run: |
          mkdir -p dist
          find artifacts -type f -print0 | xargs -0 -I{} mv -n {} dist/ || true

      - name: 创建 GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
