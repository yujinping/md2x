name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            cli_artifact: target/release/md2x
            cli_target: ""
            gui_bundles: deb
            tauri_target: ""
            dmg_source: ""
          # macOS 通用版：一个 dmg 同时包含 x64 + arm64
          - platform: macos-universal
            os: macos-latest
            cli_artifact: target/release/md2x
            cli_target: ""
            gui_bundles: dmg
            tauri_target: --target universal-apple-darwin
            dmg_source: target/universal-apple-darwin/release/bundle/dmg
          # macOS Intel (x86_64) 专版 dmg
          - platform: macos-x64
            os: macos-latest
            cli_artifact: target/x86_64-apple-darwin/release/md2x
            cli_target: x86_64-apple-darwin
            gui_bundles: dmg
            tauri_target: --target x86_64-apple-darwin
            dmg_source: target/x86_64-apple-darwin/release/bundle/dmg
          # macOS Apple Silicon (arm64) 专版 dmg
          - platform: macos-arm64
            os: macos-latest
            cli_artifact: target/aarch64-apple-darwin/release/md2x
            cli_target: aarch64-apple-darwin
            gui_bundles: dmg
            tauri_target: --target aarch64-apple-darwin
            dmg_source: target/aarch64-apple-darwin/release/bundle/dmg
          - platform: windows
            os: windows-latest
            cli_artifact: target/release/md2x.exe
            cli_target: ""
            gui_bundles: nsis
            tauri_target: ""
            dmg_source: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 三种 macOS 变体（universal / x64 / arm64）都需要这两个目标
      - name: Install macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev

      # 原生构建：linux / windows，以及 macOS 通用版（通用版后续用 lipo 覆盖）
      - name: Build CLI (release)
        if: matrix.cli_target == '' && matrix.platform != 'macos-universal'
        run: cargo build --release -p md2x-cli

      # macOS 专版：按矩阵目标架构构建 CLI
      - name: Build CLI (macOS 单架构)
        if: runner.os == 'macOS' && matrix.cli_target != ''
        run: cargo build --release -p md2x-cli --target ${{ matrix.cli_target }}

      # macOS 通用版：分别构建两个架构后 lipo 合并
      - name: Build CLI (universal, macOS)
        if: matrix.platform == 'macos-universal'
        run: |
          cargo build --release -p md2x-cli --target aarch64-apple-darwin
          cargo build --release -p md2x-cli --target x86_64-apple-darwin
          lipo -create -output target/release/md2x \
            target/aarch64-apple-darwin/release/md2x \
            target/x86_64-apple-darwin/release/md2x

      # 以平台区分文件名的形式上传 CLI，避免发布时同名文件互相覆盖
      - name: Prepare CLI artifact
        shell: bash
        env:
          CLI_ARTIFACT: ${{ matrix.cli_artifact }}
          PLATFORM: ${{ matrix.platform }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          mkdir -p dist-cli
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$CLI_ARTIFACT" "dist-cli/md2x-$PLATFORM.exe"
          else
            cp "$CLI_ARTIFACT" "dist-cli/md2x-$PLATFORM"
          fi

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v5
        with:
          name: md2x-cli-${{ matrix.platform }}
          path: dist-cli

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build GUI bundles
        working-directory: crates/md2x-gui
        run: cargo tauri build --bundles ${{ matrix.gui_bundles }} ${{ matrix.tauri_target }}

      # 三种 macOS 变体的 dmg 都归拢到统一路径，便于统一上传
      - name: 归拢 macOS dmg
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/release/bundle/dmg
          cp ${{ matrix.dmg_source }}/*.dmg target/release/bundle/dmg/

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v5
        with:
          name: md2x-gui-${{ matrix.platform }}
          # 只上传安装包产物，避免把 bundle 目录下的中间产物（AppDir 等）一并上传
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe

  release:
    name: 发布 GitHub Release
    needs: build
    # 仅 tag 推送（v*）时创建 Release，push main 只构建不发布
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # RELEASE_NOTES.md 缺失时给出占位说明，避免 body_path 指向不存在的文件
      - name: 准备发布说明
        run: |
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "本版本由 CI 自动发布。发版前可在 RELEASE_NOTES.md 中补充详细说明。" > RELEASE_NOTES.md
          fi

      - name: 下载各平台构建产物
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: 展平产物目录
        run: |
          mkdir -p dist
          find artifacts -type f -print0 | xargs -0 -I{} mv -n {} dist/ || true

      - name: 创建 GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}