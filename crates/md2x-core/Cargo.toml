[package]
name = "md2x-core"
version = "0.2.0"
edition = "2021"
description = "Core library for md2x - Markdown to PDF conversion engine"

[dependencies]
comrak = "0.28"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "plist-load"] }
ureq = "2"
zip = "8.6.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "md2x_core"
path = "src/lib.rs"

[dev-dependencies]
