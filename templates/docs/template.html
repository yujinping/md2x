<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{THEME_LOCK}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // {{THEME_LOCK}} 为 auto 时先落定为具体档位再绘样式：
  // 纯 CSS 想在媒体查询里复用同一组暗色变量只能整段复制，交给这三行更简单。
  (function () {
    var t = document.documentElement.getAttribute('data-theme');
    if (t !== 'light' && t !== 'dark') {
      document.documentElement.setAttribute(
        'data-theme',
        window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      );
    }
  })();
</script>
<title>{{TITLE}}</title>
<!--
  md2x 自带模版（技术文档）

  用法：本目录整份复制成 <你的模版名>/ 再改，原目录保持干净便于对照。
  约定：
  - 入口文件必须叫 template.html，且含 {{BODY}} 占位符
  - template.json 提供元数据（name/description/version/author/preview）
  - preview.svg / preview.png 之一作缩略图

  版式：左侧固定目录 + 右侧正文，滚动时高亮当前章节。
  刻意使用 .sidebar / .main-content 类名与 --content-max-width 变量，
  这样设置里的「全宽」选项（注入 {{WIDTH_VARS}}）会自动隐藏侧栏并放开正文宽度。
-->
<style>{{GITHUB_MD_CSS}}</style>
<!-- 代码高亮：技术文档里代码块密度高，深色块配浅色页面是常见做法，
     也避免 token 配色在明暗两套主题下都要重配一遍 -->
<style>{{ATOM_ONE_DARK_CSS}}</style>
<script>{{HIGHLIGHT_JS}}</script>
<style>
  /* ===== 主题变量：一处分档，全局生效 ===== */
  :root {
    --fg: #1f2328;
    --fg-dim: #59636e;
    --bg: #ffffff;
    --bg-soft: #f7f8fa;
    --border: #e3e7ec;
    --accent: #2f6feb;
    --code-bg: #f6f8fa;
    --content-max-width: 780px;
  }
  html[data-theme="dark"] {
    --fg: #e6edf3;
    --fg-dim: #9198a1;
    --bg: #0d1117;
    --bg-soft: #11161d;
    --border: #2a3038;
    --accent: #5b9bff;
    --code-bg: #161b22;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 左侧固定目录 ===== */
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 272px;
    padding: 28px 20px 48px;
    overflow-y: auto;
    background: var(--bg-soft);
    border-right: 1px solid var(--border);
    font-size: 13px;
    line-height: 1.6;
  }
  .brand { padding: 0 8px 20px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
  .brand-mark {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .brand-title { font-size: 14.5px; font-weight: 650; line-height: 1.45; color: var(--fg); word-break: break-word; }
  .nav-label {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--fg-dim);
    padding: 0 8px;
    margin-bottom: 8px;
  }
  .nav ul { list-style: none; margin: 0; padding: 0; }
  .nav ul ul { padding-left: 13px; }
  .nav li { margin: 1px 0; }
  .nav a {
    display: block;
    padding: 5px 9px;
    border-radius: 6px;
    border-left: 2px solid transparent;
    color: var(--fg-dim);
    text-decoration: none;
    transition: color .15s, background .15s;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .nav a:hover { color: var(--fg); background: rgba(127, 127, 127, .1); }
  .nav a.is-active {
    color: var(--accent);
    background: rgba(47, 111, 235, .1);
    border-left-color: var(--accent);
    font-weight: 600;
  }
  /* 本模版不启用逐级折叠：目录常驻展开，滚动高亮已能指明位置 */
  .nav .toc-toggle { display: none; }
  /* 文档没有任何标题时，整块目录（含标签）隐藏 */
  .sidebar:has(.nav ul:empty) .nav-label { display: none; }

  /* ===== 右侧正文 ===== */
  .main-content {
    margin-left: 272px;
    padding: 56px 48px 120px;
  }
  .markdown-body {
    max-width: var(--content-max-width);
    margin: 0 auto;
    font-size: 15.5px;
    line-height: 1.78;
    color: var(--fg);
    background: transparent;
    /* 把 github-markdown-css 依赖的变量指到本模版档位：
       否则它会跟随系统深浅取色，与导出时固化的档位不一致 */
    --color-fg-default: var(--fg);
    --color-fg-muted: var(--fg-dim);
    --color-canvas-default: transparent;
    --color-canvas-subtle: var(--code-bg);
    --color-border-default: var(--border);
    --color-border-muted: var(--border);
    --color-neutral-muted: rgba(127, 127, 127, .16);
    --color-accent-fg: var(--accent);
  }
  .markdown-body h1, .markdown-body h2, .markdown-body h3 { letter-spacing: -0.01em; }
  .markdown-body h1:first-child { margin-top: 0; }
  .markdown-body h2 {
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
    /* 滚动到锚点时给 sticky 之外的顶部留白 */
    scroll-margin-top: 24px;
  }
  .markdown-body h1, .markdown-body h3, .markdown-body h4 { scroll-margin-top: 24px; }
  .markdown-body a { color: var(--accent); }
  .markdown-body img { max-width: 100%; height: auto; }
  .markdown-body pre {
    border-radius: 8px;
    /* atom-one-dark 只给 token 上色，底色统一由 pre 提供：
       否则 github-markdown-css 的浅色 pre 底会把浅色 token 压成「浅字浅底」 */
    background: #282c34;
    border-color: #23272e;
    color: #abb2bf;
  }
  .markdown-body pre code,
  .markdown-body pre code.hljs { background: transparent; }
  .markdown-body :not(pre) > code { border-radius: 4px; }
  .markdown-body table th { background: var(--code-bg); }

  /* ===== 打印：侧栏让位，正文独占；打印目录页可见 ===== */
  .print-toc { display: none; }
  @media print {
    .sidebar { display: none; }
    .main-content { margin-left: 0; padding: 0; }
    .markdown-body { max-width: none; }
    .print-toc { display: block; break-after: page; }
    .print-toc ul { list-style: none; padding: 0; margin: 0; }
    .print-toc li { margin: 6px 0; font-size: 13.5px; }
    .print-toc .print-toc-title { font-size: 18px; font-weight: 700; margin-bottom: 22px; }
    .print-toc a { color: inherit; text-decoration: none; }
    .markdown-body a { color: inherit; text-decoration: underline; }
    .markdown-body pre, .markdown-body table, .markdown-body blockquote { break-inside: avoid; }
  }

  /* ===== 窄屏：目录回到文档顶部，不占用正文宽度 ===== */
  @media (max-width: 980px) {
    .sidebar {
      position: static;
      width: auto;
      height: auto;
      padding: 20px 18px 22px;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .main-content { margin-left: 0; padding: 32px 20px 80px; }
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">md2x</div>
      <div class="brand-title">{{TITLE}}</div>
    </div>
    <div class="nav-label">目录</div>
    <nav class="nav"><ul>{{TOC}}</ul></nav>
  </aside>

  <main class="main-content">
    {{PRINT_TOC}}
    <article class="markdown-body">{{BODY}}</article>
  </main>

  <script>
    // 先高亮再挂滚动监听：高亮会改变代码块高度，先跑完可避免首屏高亮位置偏一格
    try { hljs.highlightAll(); } catch (e) {}

    // 滚动高亮当前章节：取最后一个「顶部已越过阅读线」的标题。
    // 比 IntersectionObserver 更好预测——长章节、锚点跳转、浏览器恢复滚动位置都表现一致。
    (function () {
      var links = {};
      var list = document.querySelectorAll('.nav a[href^="#"]');
      for (var i = 0; i < list.length; i++) {
        links[list[i].getAttribute('href')] = list[i];
      }
      var heads = document.querySelectorAll(
        '.markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4'
      );
      var active = null;
      function sync() {
        var cur = null;
        for (var j = 0; j < heads.length; j++) {
          if (heads[j].getBoundingClientRect().top <= 120) cur = heads[j];
          else break;
        }
        var link = cur && cur.id ? links['#' + cur.id] : null;
        if (link === active) return;
        if (active) active.classList.remove('is-active');
        active = link || null;
        if (active) active.classList.add('is-active');
      }
      var raf = 0;
      window.addEventListener('scroll', function () {
        if (raf) return;
        raf = requestAnimationFrame(function () { raf = 0; sync(); });
      }, { passive: true });
      sync();
    })();
  </script>
</body>
</html>
