<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="正式报告模版预览">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2efe8"/>
      <stop offset="100%" stop-color="#e6e2d9"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>

  <!-- 纸张 -->
  <rect x="82" y="16" width="316" height="288" rx="2" fill="#fffdf8" stroke="#d8d2c6"/>

  <!-- 双线 + 居中书名 -->
  <rect x="106" y="38" width="268" height="3" fill="#2a2620"/>
  <rect x="106" y="44" width="268" height="1" fill="#2a2620"/>
  <rect x="170" y="60" width="140" height="12" rx="1" fill="#2a2620"/>
  <rect x="106" y="86" width="268" height="1" fill="#d8d2c6"/>

  <!-- 目录：居中标签 + 细线夹持 -->
  <rect x="216" y="100" width="48" height="5" rx="2.5" fill="#8a8578"/>
  <g fill="#bdb6a8">
    <rect x="106" y="118" width="104" height="4" rx="2"/>
    <rect x="122" y="130" width="86" height="4" rx="2"/>
    <rect x="106" y="142" width="92" height="4" rx="2"/>
  </g>
  <line x1="106" y1="158" x2="374" y2="158" stroke="#d8d2c6"/>

  <!-- 正文：居中一级标题 + 首行缩进的段落 -->
  <rect x="196" y="176" width="88" height="9" rx="1" fill="#2a2620"/>
  <g fill="#c9c2b4">
    <rect x="122" y="198" width="252" height="4" rx="2"/>
    <rect x="106" y="208" width="268" height="4" rx="2"/>
    <rect x="106" y="218" width="248" height="4" rx="2"/>
    <rect x="122" y="230" width="252" height="4" rx="2"/>
    <rect x="106" y="240" width="264" height="4" rx="2"/>
  </g>

  <!-- 表格：细线网格 -->
  <g stroke="#d8d2c6" fill="none">
    <rect x="106" y="258" width="268" height="34"/>
    <line x1="106" y1="275" x2="374" y2="275"/>
    <line x1="196" y1="258" x2="196" y2="292"/>
    <line x1="286" y1="258" x2="286" y2="292"/>
  </g>
  <g fill="#c9c2b4">
    <rect x="114" y="264" width="60" height="4" rx="2"/>
    <rect x="204" y="264" width="52" height="4" rx="2"/>
    <rect x="294" y="264" width="56" height="4" rx="2"/>
    <rect x="114" y="281" width="48" height="4" rx="2"/>
    <rect x="204" y="281" width="58" height="4" rx="2"/>
    <rect x="294" y="281" width="44" height="4" rx="2"/>
  </g>
</svg>
