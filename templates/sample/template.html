<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{THEME_LOCK}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // {{THEME_LOCK}} 为 auto 时先落定为具体档位再绘样式：
  // 纯 CSS 想在媒体查询里复用同一组暗色变量只能整段复制，交给这三行更简单。
  (function () {
    var t = document.documentElement.getAttribute('data-theme');
    if (t !== 'light' && t !== 'dark') {
      document.documentElement.setAttribute(
        'data-theme',
        window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      );
    }
  })();
</script>
<title>{{TITLE}}</title>
<!--
  md2x 外置模版示例（简约排版）

  约定：
  - 本文件必须名为 template.html，且含 {{BODY}} 占位符
  - 同目录的 template.json 提供元数据（name/description/version/author/preview）
  - 同目录放 preview.png / preview.jpg / preview.webp / preview.svg 之一作缩略图

  可用占位符见模版目录下 README.md。样式与脚本请内联，保持导出自包含。
-->
<style>{{GITHUB_MD_CSS}}</style>
<style>
  /* ===== 主题变量：一处分档，全局生效 ===== */
  :root {
    --fg: #1f2328;
    --fg-dim: #59636e;
    --bg: #ffffff;
    --border: #d1d9e0;
    --accent: #0969da;
    --code-bg: #f6f8fa;
  }
  html[data-theme="dark"] {
    --fg: #e6edf3;
    --fg-dim: #9198a1;
    --bg: #0d1117;
    --border: #30363d;
    --accent: #4493f8;
    --code-bg: #161b22;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 32px 96px;
  }
  .page-title {
    font-size: 30px;
    line-height: 1.3;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 28px;
    padding-bottom: 18px;
    border-bottom: 2px solid var(--border);
  }

  /* ===== 顶部目录框 ===== */
  .toc-box {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 22px;
    margin-bottom: 36px;
  }
  /* 文档无标题时 {{TOC}} 为空串，此时整框自动消失 */
  .toc-box ul:empty { display: none; }
  .toc-box:has(ul:empty) { display: none; }
  .toc-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin-bottom: 10px;
  }
  .toc-box ul { list-style: none; margin: 0; padding: 0; }
  .toc-box ul ul { padding-left: 16px; }
  .toc-box li { margin: 4px 0; font-size: 13.5px; }
  .toc-box a { color: var(--fg-dim); text-decoration: none; }
  .toc-box a:hover { color: var(--accent); }
  /* 本模版不启用逐级折叠：目录整棵树静态展开，打印更可读 */
  .toc-box .toc-toggle { display: none; }

  /* ===== 正文：把 github-markdown-css 依赖的变量指到本模版的档位上 =====
     否则它会按系统深浅自行取色，与导出时固化的档位不一致（暗系统 + 浅模版会变成浅字白底） */
  .markdown-body {
    font-size: 15.5px;
    line-height: 1.75;
    color: var(--fg);
    background: transparent;
    --color-fg-default: var(--fg);
    --color-fg-muted: var(--fg-dim);
    --color-canvas-default: transparent;
    --color-canvas-subtle: var(--code-bg);
    --color-border-default: var(--border);
    --color-border-muted: var(--border);
    --color-neutral-muted: rgba(127, 127, 127, 0.16);
    --color-accent-fg: var(--accent);
  }
  .markdown-body h1,
  .markdown-body h2,
  .markdown-body h3 { letter-spacing: -0.01em; }
  .markdown-body h1:first-child { margin-top: 0; }
  .markdown-body h2 {
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  .markdown-body a { color: var(--accent); }
  .markdown-body img { max-width: 100%; height: auto; }
  .markdown-body pre { border-radius: 8px; border: 1px solid var(--border); }
  .markdown-body :not(pre) > code { border-radius: 4px; }

  @media (max-width: 720px) {
    .page { padding: 32px 18px 64px; }
    .page-title { font-size: 24px; }
  }
  @media print {
    .page { max-width: none; padding: 0; }
    .toc-box { break-inside: avoid; }
    .markdown-body a { color: inherit; text-decoration: underline; }
  }
</style>
</head>
<body>
  <main class="page">
    <h1 class="page-title">{{TITLE}}</h1>
    <nav class="toc-box"><div class="toc-label">目录</div><ul>{{TOC}}</ul></nav>
    <article class="markdown-body">{{BODY}}</article>
  </main>
</body>
</html>
